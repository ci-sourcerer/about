name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-preview-${0}', github.event.pull_request.number) || 'gh-pages' }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          destination_dir: ${{ github.event_name == 'pull_request' && format('previews/pr-${0}', github.event.pull_request.number) || '' }}
          cname: about.ci-sourcerer.com
          keep_files: true

      - name: Find preview URL comment
        if: ${{ github.event_name == 'pull_request' }}
        id: find_preview_comment
        uses: peter-evans/find-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- gh-pages-pr-preview -->"

      - name: Create preview URL comment
        if: ${{ github.event_name == 'pull_request' && steps.find_preview_comment.outputs.comment-id == '' }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- gh-pages-pr-preview -->
            🚀 PR preview is available:
            https://about.ci-sourcerer.com/previews/pr-${{ github.event.pull_request.number }}/

            _This comment is updated automatically when the preview is rebuilt._

      - name: Update preview URL comment
        if: ${{ github.event_name == 'pull_request' && steps.find_preview_comment.outputs.comment-id != '' }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          comment-id: ${{ steps.find_preview_comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- gh-pages-pr-preview -->
            🚀 PR preview is available:
            https://about.ci-sourcerer.com/previews/pr-${{ github.event.pull_request.number }}/

            _This comment is updated automatically when the preview is rebuilt._
